tables:
  contacts:
    columns:
      id:
        type: uuid
        primary: true
        auto: true
      name:
        type: string
        required: true
      email:
        type: string
        pattern: "^[\\w.+-]+@[\\w-]+\\.[\\w.]+$"
      phone:
        type: string
      title:
        type: string
      company:
        type: string
      company_id:
        type: string
      source:
        type: enum
        values: [inbound, outbound, referral, website, event, social, other]
      owner:
        type: string
      tags:
        type: string
      status:
        type: enum
        values: [active, inactive, pending]
      created_at:
        type: datetime
        auto: true
      updated_at:
        type: datetime
        auto: true
        on_update: true
    merge_strategy:
      status: last_write_wins
      phone: last_write_wins
      email: last_write_wins
      owner: last_write_wins

  companies:
    columns:
      id:
        type: uuid
        primary: true
        auto: true
      name:
        type: string
        required: true
      industry:
        type: string
      size:
        type: enum
        values: [startup, sme, enterprise]
      website:
        type: string
      address:
        type: string
      phone:
        type: string
      created_at:
        type: datetime
        auto: true
      updated_at:
        type: datetime
        auto: true
        on_update: true
    merge_strategy:
      name: last_write_wins
      industry: last_write_wins

  deals:
    columns:
      id:
        type: uuid
        primary: true
        auto: true
      name:
        type: string
        required: true
      contact_id:
        type: string
      company_id:
        type: string
      stage:
        type: enum
        values: [lead, qualified, proposal, negotiation, won, lost]
        required: true
      value:
        type: string
      currency:
        type: string
      expected_close_date:
        type: string
      owner:
        type: string
      created_at:
        type: datetime
        auto: true
      updated_at:
        type: datetime
        auto: true
        on_update: true
    merge_strategy:
      stage: last_write_wins
      value: last_write_wins
      owner: last_write_wins

  interactions:
    columns:
      id:
        type: uuid
        primary: true
        auto: true
      contact_id:
        type: string
        required: true
      deal_id:
        type: string
      type:
        type: enum
        values: [call, email, meeting, wechat, note]
      note:
        type: string
        required: true
      created_at:
        type: datetime
        auto: true

  tasks:
    columns:
      id:
        type: uuid
        primary: true
        auto: true
      title:
        type: string
        required: true
      contact_id:
        type: string
      deal_id:
        type: string
      assignee:
        type: string
      due_date:
        type: string
      priority:
        type: enum
        values: [low, medium, high]
      status:
        type: enum
        values: [todo, in_progress, done, cancelled]
        required: true
      created_at:
        type: datetime
        auto: true
      updated_at:
        type: datetime
        auto: true
        on_update: true
    merge_strategy:
      status: last_write_wins
      assignee: last_write_wins
