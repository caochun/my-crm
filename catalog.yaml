description: 销售团队 CRM 数据，管理客户联系人、公司、商机、沟通记录和合同
tables:
  contacts: 客户联系人。包含姓名、邮箱、电话、职位、所属公司、线索来源、负责人、标签、跟进状态
  companies: 公司/客户组织。包含公司名称、行业、规模、网站、地址、电话
  deals: 销售商机/机会。跟踪销售漏斗各阶段（lead→qualified→proposal→negotiation→won/lost），记录金额和预计成交日期
  interactions: 与客户的沟通记录（只增不改）。包含沟通类型（电话/邮件/会议/微信/备注）和内容
  tasks: 待办/跟进任务。包含标题、负责人、截止日期、优先级、状态
  employees: 员工/团队成员表。包含姓名、邮箱、角色、部门、状态等，用于关联 contacts、deals、tasks 中的 owner 和 assignee
    字段
  contracts: 销售合同。包含合同号、关联商机、金额、条款、签署日期、状态、附件等
