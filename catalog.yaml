notes:
- contracts 表新增后，字段类型统一使用 uuid 作为外键类型
- contract_number 字段建议设置唯一约束，避免合同号重复
- contracts 表与 deals 表是一对多关系，一个商机可对应多个合同（如分期合同）
- 合同金额使用 string 类型以支持不同货币格式和精度需求
